name: Santra Panosu Otomatik Haber Botu

on:
  schedule:
    # Her 4 saatte bir otomatik çalışır (istediğin gibi değiştirebilirsin)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Manuel olarak 'Run workflow' diyerek test edebilmeni sağlar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Playwright Tarayıcılarını Yükle
      run: playwright install chromium

    - name: Botu Çalıştır ve Paylaşım Yap
      env:
        IG_USERNAME: ${{ secrets.IG_USERNAME }}
        IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python haber_botu.py
