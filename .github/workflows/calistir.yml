name: Haber Botu Otomasyonu

on:
  schedule:
    # Her 30 dakikada bir çalıştır (Cron formatı)
    - cron: '*/30 * * * *'
  # Test edebilmen için manuel çalıştırma butonu ekliyoruz
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu kopyala
      uses: actions/checkout@v3

    - name: Python'u kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Gereksinimleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Botu Çalıştır
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python haber_botu.py
