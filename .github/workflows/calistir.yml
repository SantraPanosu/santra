name: Instagram Auto Post

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Ensure system libraries (for Playwright and Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxss1 \
            libgbm1 libgtk-3-0 libx11-xcb1 libxcomposite1 libxdamage1 \
            libxrandr2 libxrender1 libxcb1 libxext6 libx264-dev libffi-dev \
            ca-certificates fonts-liberation libjpeg-dev zlib1g-dev \
            libfreetype6-dev liblcms2-dev libwebp-dev

      - name: Install Python deps (upgrade pip and instagrapi first)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade instagrapi
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Download IG session (if exists)
        uses: actions/download-artifact@v4
        with:
          name: ig_session
          path: /tmp
        continue-on-error: true

      - name: List repository files (debug)
        run: |
          echo "Working dir: $(pwd)"
          ls -la

      - name: Run haber_botu
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_2FA_SECRET: ${{ secrets.IG_2FA_SECRET }}
          IG_2FA_CODE: ${{ secrets.IG_2FA_CODE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Starting bot..."
          python ./haber_botu.py

      - name: Upload IG session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig_session
          path: /tmp/ig_session.json
