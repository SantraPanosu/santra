name: Saha Ekrani Otomatik Bot

on:
  schedule:
    # Her 2 saatte bir tam saatinde çalışır (Örn: 10:00, 12:00, 14:00)
    - cron: '*/30 * * * *' 
  workflow_dispatch: # İstediğin zaman GitHub üzerinden elle tetikleme butonu koyar

permissions:
  contents: write

jobs:
  haber-paylas:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install groq playwright feedparser
        playwright install chromium --with-deps

    - name: Saha Ekrani Botunu Çalıştır
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python haber_botu.py
